{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Product | manageHoise?</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Shared & Page Styles -->
  <link rel="stylesheet" href="{% static 'css/header.css' %}" />
  <link rel="stylesheet" href="{% static 'css/footer.css' %}" />
  <link rel="stylesheet" href="{% static 'css/delete_product.css' %}" />

  <script src="{% static 'js/header.js' %}" defer></script>
</head>
<body class="mh-body">

  <!-- Header Inclusion -->
  {% include 'header.html' %}

  <!-- Main Section Wrapper -->
  <main class="mh-delete-wrapper">

    <!-- Hero Banner -->
    <header class="mh-delete-banner">
      <div class="mh-banner-container">
        <h1 class="mh-banner-title">Delete Product</h1>
        <p class="mh-banner-subtitle">Manage your inventory list on ManageHouse</p>
      </div>
    </header>

    <!-- Confirmation Box -->
    <div class="mh-delete-container">
      <div class="mh-delete-card">
        
        <div class="mh-card-header">
          <div class="mh-warning-badge">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <h2>Are you sure?</h2>
          <p class="mh-confirmation-text">
            You are about to permanently remove <strong>"{{ product.name }}"</strong> from your marketplace catalog.
          </p>
        </div>

        <form method="POST" class="mh-delete-form">
          {% csrf_token %}
          <div class="mh-action-buttons">
            <button type="submit" class="mh-btn-delete">
              <i class="fa-solid fa-trash-can"></i> Yes, Delete
            </button>
            <a href="{% url 'product_list' %}" class="mh-btn-cancel">
              Cancel
            </a>
          </div>
        </form>

      </div>
    </div>

  </main>

  <!-- Footer Inclusion -->
  {% include 'footer.html' %}

</body>
</html>
