{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product | ManageHouse</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Shared & App Styles -->
  <link rel="stylesheet" href="{% static 'css/header.css' %}" />
  <link rel="stylesheet" href="{% static 'css/footer.css' %}" />
  <link rel="stylesheet" href="{% static 'css/add_product.css' %}" />

  <script src="{% static 'js/header.js' %}" defer></script>
</head>
<body class="mh-body">

  <!-- Header Inclusion -->
  {% include 'header.html' %}

  <!-- Main Section Wrapper -->
  <main class="mh-form-wrapper">
    
    <!-- Hero Banner -->
    <header class="mh-form-banner">
      <div class="mh-banner-container">
        <h1 class="mh-banner-title">Add New Product</h1>
        <p class="mh-banner-subtitle">List your item or service on the ManageHouse Marketplace</p>
      </div>
    </header>

    <!-- Card Container -->
    <div class="mh-form-container">
      <div class="mh-form-card">
        
        <div class="mh-card-header">
          <div class="mh-icon-badge">
            <i class="fa-solid fa-box-open"></i>
          </div>
          <h2>Product Details</h2>
          <p>Fill out the details below to add your product</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="mh-product-form">
          {% csrf_token %}
          
          <div class="mh-form-fields">
            {{ form.as_p }}
          </div>

          <div class="mh-form-actions">
            <button type="submit" class="mh-btn-submit">
              <i class="fa-solid fa-plus"></i> Submit Product
            </button>
            <a href="{% url 'product_list' %}" class="mh-btn-cancel">
              Cancel
            </a>
          </div>
        </form>

      </div>
    </div>

  </main>

  <!-- Footer Inclusion -->
  {% include 'footer.html' %}

</body>
</html>
